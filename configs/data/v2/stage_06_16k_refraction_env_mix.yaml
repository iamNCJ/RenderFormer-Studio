schema_version: 1
recipe_id: "v2/stage_06_16k_refraction_env_mix"
family: "v2"
partition_key: "render_v2_stage_06_16k_refraction_env_mix"
export_profile: "src/renderformer/data/profiles/v2_training_raw.yaml"
assets:
  require_external_manifest: true
template_corrections:
  background_topology_debias: false
  env_map_channel_shuffle: true
render:
  resolution: 512
  num_views: 4
  spp: 4096
  texture_size: 32
  texture_crop_resolution: 256
  texture_target_resolution: 256
  min_views: 2
  include_background: false
  use_heightmap_format: true
templates:
  # Refraction with non-blank environment maps: group weight 16 (25%).
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/corner-multi-object-patch.jsonc"
    weight: 3
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/corner-multi-object.jsonc"
    weight: 1
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/no-ceil-box-multi-patch.jsonc"
    weight: 3
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/no-ceil-box-multi.jsonc"
    weight: 1
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/plane-multi-object.jsonc"
    weight: 4
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/wall-multi-object-patch.jsonc"
    weight: 3
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-env/wall-multi-object.jsonc"
    weight: 1
  # Stronger glass with blank environment maps: group weight 48 (75%).
  # Scaling every historical weight by three preserves this group's internal mix.
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/corner-multi-object-patch.jsonc"
    weight: 9
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/corner-multi-object.jsonc"
    weight: 3
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/no-ceil-box-multi-patch.jsonc"
    weight: 9
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/no-ceil-box-multi.jsonc"
    weight: 3
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/plane-multi-object.jsonc"
    weight: 12
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/wall-multi-object-patch.jsonc"
    weight: 9
  - path: "src/renderformer/data/templates/full-new-volume/16k-refraction-no-env/wall-multi-object.jsonc"
    weight: 3
postprocess:
  enabled: true
  texture_encoder: "qwen_vae"
  model_id: "Qwen/Qwen-Image"
  revision: "75e0b4be04f60ec59a75f475837eced720f823b6"
  subfolder: "vae"
  torch_dtype: "float32"
  triangle_batch_size: 256
  keep_raw: false
  drop_keys:
    - "albedo_img"
    - "diffuse_img"
    - "glossy_img"
    - "normal_img"
  process_env_map: true
historical:
  sample_budget: null
  seed: null
  list_order: null
known_gaps:
